<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Afsal Ahamad">
  <title>Login — UniWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
  <script src="cursor.js"></script>
</head>

<body class="auth-body">

  <button class="theme-toggle-btn" onclick="toggleTheme()"
    style="position: absolute; top: 1.5rem; right: 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); box-shadow: var(--card-shadow); z-index: 1000;">
    <i data-lucide="sun" style="width:18px; height:18px;"></i>
  </button>

  <div class="auth-container">
    <div class="sidebar-logo" style="margin-bottom: 2rem; font-size: 2rem; justify-content: center;">
      <div class="sidebar-logo-icon" style="width:42px; height:42px;">
        <i data-lucide="wallet" style="width:22px; height:22px;"></i>
      </div>
      Uni<span>Wallet</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to manage your university finances.</p>

      <div id="authError" class="auth-error" style="display:none;"></div>

      <form onsubmit="login(event)">
        <div class="form-group">
          <label class="form-label">University Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="eg: alexjohn.gmail.com" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Enter Dashboard</button>
      </form>

      <a href="guest.html" class="btn-solar outline"
        style="margin-top: 1rem; width: 100%; text-decoration: none; text-align: center;">
        <i data-lucide="sparkles" style="width:16px; height:16px;"></i> Explore as Guest
      </a>

      <div class="auth-footer">
        New to UniWallet? <a href="signup.html">Create an Account</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 UniWallet. All rights reserved.<br />
    Developed by <strong>Afsal Ahamad</strong>
  </footer>

  <script>
    if (window.lucide) lucide.createIcons();
    redirectIfLoggedIn();
  </script>
</body>

</html>
