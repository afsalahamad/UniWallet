<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Afsal Ahamad">
  <title>Join UniWallet — Student Money Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
  <script src="cursor.js"></script>
</head>

<body class="auth-body">

  <button class="theme-toggle-btn" onclick="toggleTheme()"
    style="position: absolute; top: 1.5rem; right: 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); box-shadow: var(--card-shadow); z-index: 1000;">
    <i data-lucide="sun" style="width:18px; height:18px;"></i>
  </button>

  <div class="auth-container">
    <div class="sidebar-logo" style="margin-bottom: 2rem; font-size: 2rem; justify-content: center;">
      <div class="sidebar-logo-icon" style="width:42px; height:42px;">
        <i data-lucide="wallet" style="width:22px; height:22px;"></i>
      </div>
      Uni<span>Wallet</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start tracking your money smartly today.</p>

      <div id="authError" class="auth-error" style="display:none;"></div>

      <form onsubmit="signup(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="signupName" class="form-input" placeholder="e.g. Alex Johnson" required />
        </div>

        <div class="form-group">
          <label class="form-label">University Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="alexjohn.gmail.com" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Security Password</label>
          <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" required
            minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Create My Wallet</button>
      </form>

      <div class="auth-footer">
        Already a member? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 UniWallet. All rights reserved.<br />
    Developed by <strong>Afsal Ahamad</strong>
  </footer>

  <script>
    if (window.lucide) lucide.createIcons();
    redirectIfLoggedIn();
  </script>
</body>

</html>
